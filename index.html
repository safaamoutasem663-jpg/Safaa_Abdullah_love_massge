<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفاء وعبدالله 💜</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #17132f, #44305f, #a47ba8);
      color: #fff;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 35px 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 25px;
      background: rgba(255,255,255,.10);
      box-shadow: 0 15px 45px rgba(0,0,0,.2);
    }

    .heart {
      font-size: 65px;
      animation: beat 1.4s infinite;
    }

    h1 {
      font-size: 29px;
      margin-bottom: 12px;
    }

    p {
      color: #f0e6f5;
      line-height: 1.9;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 14px;
      background: #f1d6e8;
      color: #352244;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #fff;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="heart">💜</div>

    <h1>صفاء وعبدالله</h1>

    <p>
      عالم صغير يجمع قلبينا،<br>
      مهما بعدت المسافات بيننا.
    </p>

    <p>هنا رسائلنا، وكلامنا البيننا نحن الاتنين. 💌</p>

    <button onclick="alert('قريباً حنفتح عالم رسائلنا 💜')">
      عالم رسائلنا 💌
    </button>
  </main>
</body>
</html>
